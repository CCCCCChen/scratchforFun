{% extends "base.html" %}

{% block title %}刮刮乐{% endblock %}

{% block styles %}
    <style>
        :root {
            --footer-color: rgba(255,255,255,0.75);
        }

        body {
            background: linear-gradient(135deg, #2b32b2, #1488cc);
            height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }

        .glass-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .scratch-card {
            /* 适配移动端的尺寸计算 */
            aspect-ratio: 754 / 1505;
            width: min(90vw, calc(85vh * 754 / 1505)); 
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-radius: 10px;
            background: #fff;
        }

        /* 顶部背景 */
        .scratch-card .top-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: calc(100% * 831 / 1505);
            background-image: url("{{ url_for('static', filename='images/top.png') }}");
            background-repeat: no-repeat;
            background-size: 100% 100%;
            z-index: 2; /* 确保在刮层上面，如果有需要的话。但这里其实不需要，因为刮的是下面 */
            pointer-events: none; /* 让点击穿透 */
        }

        /* 底部背景 */
        .scratch-card .bottom-bg {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: calc(100% * 188 / 1505);
            background-image: url("{{ url_for('static', filename='images/bottom.png') }}");
            background-repeat: no-repeat;
            background-size: 100% 100%;
            z-index: 2;
            pointer-events: none;
        }

        /* 票号显示 */
        .ticket-number {
            position: absolute;
            bottom: 5%;
            right: 5%;
            font-size: 1.2rem;
            color: white;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.8);
            z-index: 3;
            font-family: monospace;
        }

        /* 格子容器 */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(5, 1fr);
            position: absolute;
            width: 100%;
            /* 高度 = 总高度 - 顶部图片高度 - 底部图片高度 */
            height: calc(100% - (100% * 831 / 1505) - (100% * 188 / 1505));
            top: calc(100% * 831 / 1505);
            left: 0;
            background-color: #E8E8E8;
            visibility: hidden; /* 默认隐藏，防止透视，等Canvas加载完再显示 */
        }

        .grid-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(0,0,0,0.05);
            position: relative;
        }

        .grid-item .number {
            font-size: calc(90vw / 5 * 0.4);
            font-weight: 900;
            color: #333;
            line-height: 1;
        }
        
        .grid-item .amount {
            font-size: calc(90vw / 5 * 0.2);
            color: #666;
            margin-top: 2px;
        }

        /* 适配大屏幕 */
        @media (min-width: 500px) {
            .grid-item .number {
                font-size: 1.5rem;
            }
            .grid-item .amount {
                font-size: 0.8rem;
            }
        }

        /* 特殊数字样式 */
        .lucky-number-7 {
            color: #FFD700 !important;
            text-shadow: 0 0 5px #000;
        }
        .lucky-number-77 {
            color: #FF4500 !important;
            text-shadow: 0 0 5px #000;
        }
        .lucky-number-777 {
            background: linear-gradient(45deg, #FFD700, #FF0000);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 10px rgba(255,215,0,0.5);
        }

        /* Canvas */
        #scratchCanvas {
            position: absolute;
            top: calc(100% * 831 / 1505);
            left: 0;
            width: 100%;
            height: calc(100% - (100% * 831 / 1505) - (100% * 188 / 1505));
            z-index: 1;
            touch-action: none; /* 禁止默认触摸行为 */
        }

        /* Modal Result */
        .result-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
            animation: fadeIn 0.5s;
        }

        .result-content {
            background: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            width: 80%;
            max-width: 400px;
            position: relative;
            overflow: hidden;
            animation: popUp 0.5s cubic-bezier(0.68, -0.55, 0.27, 1.55);
        }
        
        /* 庆祝礼花 */
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: #f00;
            animation: confetti-fall 3s linear infinite;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes popUp { from { transform: scale(0.5); } to { transform: scale(1); } }
        @keyframes confetti-fall { 0% { transform: translateY(-100px) rotate(0deg); } 100% { transform: translateY(500px) rotate(720deg); } }

        .result-amount {
            font-size: 3rem;
            color: #e74c3c;
            font-weight: bold;
            margin: 20px 0;
        }

        .btn-home {
            background: linear-gradient(to right, #4facfe 0%, #00f2fe 100%);
            border: none;
            padding: 12px 30px;
            color: white;
            border-radius: 25px;
            font-size: 1.1rem;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transition: transform 0.2s;
        }
        .btn-home:active { transform: scale(0.95); }
    </style>
{% endblock %}

{% block body %}
    <div class="glass-container">
        <div class="scratch-card">
            <div class="top-bg"></div>
            <div class="bottom-bg"></div>
            <div class="ticket-number">{{ ticket_number }}</div>
            
            <div class="grid-container">
                {% for item in scratch_data %}
                <div class="grid-item" data-winning="{{ item.is_winning|lower }}" data-multiplier="{{ item.multiplier }}">
                    <div class="number {% if item.number == 7 %}lucky-number-7{% elif item.number == 77 %}lucky-number-77{% elif item.number == 777 %}lucky-number-777{% endif %}">
                        {{ item.number }}
                    </div>
                    <div class="amount">￥{{ item.amount }}</div>
                </div>
                {% endfor %}
            </div>
            
            <canvas id="scratchCanvas"></canvas>
        </div>
    </div>

    <!-- Result Modal -->
    <div class="result-modal" id="resultModal">
        <div class="result-content">
            <h2 id="resultTitle">恭喜！</h2>
            <div class="result-amount" id="resultAmount">￥0</div>
            <p id="resultDesc">您赢得了一笔奖金！</p>
            <button class="btn-home" onclick="goHome()">返回首页</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script>
        // 防止 Safari bfcache (Back-Forward Cache) 导致返回时显示旧页面
        window.onpageshow = function(event) {
            if (event.persisted) {
                window.location.reload();
            }
        };

        window.onload = function() {
            const canvas = document.getElementById('scratchCanvas');
            const ctx = canvas.getContext('2d');
            let isDrawing = false;
            let scratchedPixels = 0;
            let totalPixels = 0;
            let isCompleted = false;

            function setCanvasSize() {
                // Ensure layout is ready
                if (canvas.offsetWidth === 0 || canvas.offsetHeight === 0) {
                    console.log('Canvas dimensions are 0, retrying...');
                    setTimeout(setCanvasSize, 100);
                    return;
                }

                canvas.width = canvas.offsetWidth;
                canvas.height = canvas.offsetHeight;
                ctx.fillStyle = '#CCCCCC'; // 涂层颜色
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // 添加一些纹理或文字在涂层上
                ctx.font = '20px Arial';
                ctx.fillStyle = '#999999';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('刮开涂层', canvas.width/2, canvas.height/2);
                
                totalPixels = canvas.width * canvas.height;
                
                // Canvas 绘制完成后显示底层数字
                document.querySelector('.grid-container').style.visibility = 'visible';
            }

            // 尝试多次初始化，以防万一
            setCanvasSize();
            
            // 监听 resize 事件，防止屏幕旋转或软键盘收起导致变形
            let resizeTimeout;
            window.addEventListener('resize', () => {
                // 只有当未完成时才重置，或者根据需求保留状态
                if (!isCompleted && !isDrawing) {
                    clearTimeout(resizeTimeout);
                    resizeTimeout = setTimeout(setCanvasSize, 200);
                }
            });
            
            function getEventPos(e) {
                const rect = canvas.getBoundingClientRect();
                let clientX = e.clientX;
                let clientY = e.clientY;
                if (e.touches && e.touches.length > 0) {
                    clientX = e.touches[0].clientX;
                    clientY = e.touches[0].clientY;
                }
                return {
                    x: clientX - rect.left,
                    y: clientY - rect.top
                };
            }

            function scratch(e) {
                if (!isDrawing || isCompleted) return;
                e.preventDefault();
                const pos = getEventPos(e);
                
                ctx.globalCompositeOperation = 'destination-out';
                ctx.beginPath();
                ctx.arc(pos.x, pos.y, 25, 0, Math.PI * 2);
                ctx.fill();

                // 如果用户还在操作，重置自动完成定时器
                if (autoFinishTimer) {
                    clearTimeout(autoFinishTimer);
                    autoFinishTimer = null;
                }

                // 如果已经达标，且用户还在操作，准备新的倒计时
                if (isThresholdReached) {
                    autoFinishTimer = setTimeout(finishScratch, 1000);
                }

                checkProgress();
            }

            // 节流检查进度，避免卡顿
            let checkTimeout;
            let autoFinishTimer = null;
            let isThresholdReached = false;

            function checkProgress() {
                if (isThresholdReached || checkTimeout) return;
                
                checkTimeout = setTimeout(() => {
                    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    let pixels = 0;
                    // 抽样检查，提高性能
                    for (let i = 3; i < imageData.data.length; i += 40) { // 每10个像素查一个
                        if (imageData.data[i] === 0) pixels++;
                    }
                    // 总像素也要相应缩放
                    const sampledTotal = imageData.data.length / 40;
                    
                    if (pixels / sampledTotal > 0.6) { // 60% 阈值
                        isThresholdReached = true;
                        // 首次达标，开始倒计时
                        if (!autoFinishTimer) {
                            autoFinishTimer = setTimeout(finishScratch, 1000);
                        }
                    }
                    checkTimeout = null;
                }, 100);
            }

            function finishScratch() {
                if (isCompleted) return;
                isCompleted = true;
                
                // 淡出 Canvas
                canvas.style.transition = 'opacity 0.5s';
                canvas.style.opacity = '0';
                setTimeout(() => canvas.style.display = 'none', 500);

                // 计算奖金
                let totalWinning = 0;
                const gridItems = document.querySelectorAll('.grid-item');
                gridItems.forEach(item => {
                    if (item.dataset.winning === 'true') {
                        const amount = parseInt(item.querySelector('.amount').textContent.replace('￥', ''));
                        const multiplier = parseInt(item.dataset.multiplier);
                        totalWinning += amount * multiplier;
                    }
                });

                // 提交结果
                fetch('/complete_scratch/{{ ticket_id }}', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'}
                }).then(() => {
                    // 显示结果 Modal
                    setTimeout(() => showResult(totalWinning), 600);
                });
            }

            function showResult(amount) {
                const modal = document.getElementById('resultModal');
                const title = document.getElementById('resultTitle');
                const amountEl = document.getElementById('resultAmount');
                const desc = document.getElementById('resultDesc');

                amountEl.innerText = '￥' + amount;
                
                if (amount > 0) {
                    title.innerText = '🎉 恭喜中奖！';
                    title.style.color = '#e74c3c';
                    desc.innerText = '手气真棒！';
                    // 撒花
                    confetti({
                        particleCount: 100,
                        spread: 70,
                        origin: { y: 0.6 }
                    });
                } else {
                    title.innerText = '谢谢惠顾';
                    title.style.color = '#7f8c8d';
                    desc.innerText = '差一点点就中奖了，再接再厉！';
                }
                
                modal.style.display = 'flex';
            }

            canvas.addEventListener('mousedown', (e) => { isDrawing = true; scratch(e); });
            canvas.addEventListener('mousemove', scratch);
            canvas.addEventListener('mouseup', () => isDrawing = false);
            canvas.addEventListener('mouseleave', () => isDrawing = false);

            canvas.addEventListener('touchstart', (e) => { isDrawing = true; scratch(e); });
            canvas.addEventListener('touchmove', scratch);
            canvas.addEventListener('touchend', () => isDrawing = false);
        };

        function goHome() {
            // 使用 replace 替换当前历史记录，防止点击返回再次进入此页面
            window.location.replace("{{ url_for('dashboard') }}");
        }
    </script>
{% endblock %}
