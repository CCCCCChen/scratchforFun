{% extends "base.html" %}

{% block title %}后台管理{% endblock %}

{% block head_extra %}
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
{% endblock %}

{% block styles %}
    <style>
        :root {
            --footer-color: rgba(0,0,0,0.55);
        }

        body {
            background-color: #f8f9fa;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            max-width: 400px;
            width: 100%;
            padding: 2rem;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }
    </style>
{% endblock %}

{% block body %}
    <div class="login-card">
        <h3 class="text-center mb-4">管理员登录</h3>
        <form method="POST">
            <div class="mb-3">
                <input type="password" name="password" class="form-control form-control-lg" placeholder="请输入管理员密码" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 btn-lg">进入后台</button>
        </form>
        <div class="text-center mt-3">
            <a href="{{ url_for('index') }}" class="text-muted text-decoration-none">返回首页</a>
        </div>
    </div>
{% endblock %}
